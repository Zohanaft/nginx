worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Dev: many parallel /_nuxt/@fs/* requests to Vite — avoid tiny buffers / defaults causing 502 under burst + HTTP/2 (tuna).
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;

    server {
        # h2c for tunnel->origin traffic; external TLS is terminated by tunnel
        listen 80;
        http2 on;
        server_name localhost;
        client_max_body_size 10M;
        access_log off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # WSS service: /api/wss (websocket + telegram webhook ingress)
        location /api/wss {
            proxy_redirect off;
            proxy_pass http://crm-tg-app-wss:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Nitro S3 proxy (health/upload/delete). Longer prefix than /api → wins over Nest below.
        # Without this, /api/storage/* is rewritten to /storage/* on Nest → 404.
        location /api/storage {
            proxy_redirect off;
            proxy_pass http://crm-tg-app:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_request_buffering off;
            client_max_body_size 10M;
        }

        # Nest: /api (backend API) - strip /api prefix
        location /api {
            proxy_redirect off;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://crm-tg-app-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Nuxt Icon server bundle (must not hit /api → Nest)
        location /_nuxt_icon {
            proxy_redirect off;
            proxy_pass http://crm-tg-app:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # Nuxt: /_nuxt (chunks, HMR, Vite @fs deps — high concurrency from HTTP/2)
        location /_nuxt {
            proxy_redirect off;
            proxy_pass http://crm-tg-app:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_buffers 32 64k;
            proxy_busy_buffers_size 512k;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # Nuxt: /node_modules (static assets in dev)
        location /node_modules {
            proxy_redirect off;
            proxy_pass http://crm-tg-app:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_buffers 32 64k;
            proxy_busy_buffers_size 512k;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # Nuxt: / (SPA + catch-all)
        location / {
            proxy_redirect off;
            proxy_pass http://crm-tg-app:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
